name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch/PR cancels the still-running CI for the outdated commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm must be installed before setup-node so its `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the engines floor (>=22) so CI catches accidental use of newer-Node APIs.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter @spend-watcher/contract --filter @spend-watcher/e2e --filter @spend-watcher/ui run typecheck

      - name: Unit & component tests (vitest)
        run: pnpm --filter @spend-watcher/ui run test:run

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The cache key must track the version the e2e package resolves (not the root one), since
      # that's the binary that runs the tests and it only accepts exactly-matching browser builds.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @spend-watcher/e2e exec playwright install --with-deps chromium

      # OS-level libraries live outside ~/.cache/ms-playwright, so they must be installed even
      # when the browser binaries come from cache.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @spend-watcher/e2e exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      # Uploaded on success too: with retries enabled, a green run can still contain flaky-retry
      # traces worth inspecting.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  # Aggregate status so branch protection only needs to require "CI OK" instead of every job.
  ci-ok:
    name: CI OK
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
